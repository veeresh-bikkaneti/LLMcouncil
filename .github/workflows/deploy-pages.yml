name: Deploy llmcouncil-web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'llmcouncil-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: llmcouncil-web/package-lock.json

      - name: Install dependencies
        working-directory: llmcouncil-web
        run: npm ci

      - name: Build (base path = /<repo>/ for project Pages)
        working-directory: llmcouncil-web
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: llmcouncil-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
